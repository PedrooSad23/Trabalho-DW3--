version: "3"
services:
  php:
    build: .
    image: php:8.1.16-apache
    container_name: "php-apache-dw"
    volumes:
      - ./codigo/:/var/www/html/
    ports:
      - "81:80"
  
  db:
    image: mariadb:10.5
    container_name: "mariadb-dw"
    restart: always
    volumes:
      - ./banco/:/docker-entrypoint-initdb.d/
    environment:
      MYSQL_ROOT_PASSWORD: "123"
      MYSQL_DATABASE: "mydb"
    ports:
      - "3307:3306"
